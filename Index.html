<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #b8b8c5;
      font-size: 18px;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid #333344;
      background: #151520;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #6c63ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #574fff;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 15px;
      background: #151520;
      color: #b8b8c5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI Video Generator</h1>

    <p>
      Create cinematic AI videos from your imagination.
    </p>

    <textarea
      id="prompt"
      placeholder="Describe your video... Example: A small dragon fights a giant dragon in a cinematic 3D fantasy forest">
    </textarea>

    <button onclick="generateVideo()">
      Generate Video
    </button>

    <div class="result" id="result">
      Your generated video will appear here.
    </div>

  </div>

  <script>
    function generateVideo() {
      const prompt = document.getElementById("prompt").value;

      if (prompt.trim() === "") {
        alert("Please enter a video prompt.");
        return;
      }

      document.getElementById("result").innerText =
        "Video generation will be connected here soon...";
    }
  </script>

</body>
</html>
